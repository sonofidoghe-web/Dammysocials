<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Dammy Social</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --green-dark:   #33501f;
    --green:        #5c7a29;
    --green-mid:    #6d8f2f;
    --green-light:  #edf2e2;
    --ink:          #14150f;
    --ink-soft:     #55584d;
    --grey-line:    #e6e6e0;
    --paper:        #f7f6f2;
    --surface:      #ffffff;
    --outline-border: #d8d8d2;
    --red-bg:       #fbeaea;
    --red-text:     #a4302a;
    --red-border:   #f0c9c7;
    --green-bg:     #e9f1de;
    --green-text:   #3f6320;
    --green-border: #cfe3ba;
    font-size: 16px;
  }

  html[data-theme="dark"]{
    --green-dark:   #33501f;
    --green:        #6d8f2f;
    --green-mid:    #7a9e35;
    --green-light:  rgba(140,168,70,0.16);
    --ink:          #f2f1ea;
    --ink-soft:     #b6b8ac;
    --grey-line:    #2a2c21;
    --paper:        #121309;
    --surface:      #1b1d14;
    --outline-border: #3a3c30;
    --red-bg:       rgba(164,48,42,0.16);
    --red-text:     #e28b85;
    --red-border:   rgba(164,48,42,0.35);
    --green-bg:     rgba(140,168,70,0.16);
    --green-text:   #b7d17a;
    --green-border: rgba(140,168,70,0.35);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s ease, color .25s ease;
  }

  a{ text-decoration:none; color:inherit; }
  img{ display:block; }

  .page{
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 48px 24px 70px;
  }

  .top-bar{
    width: 100%;
    max-width: 460px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 56px;
  }

  .logo img{ height: 68px; }

  .icon-btn{
    width: 24px;
    height: 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color: var(--ink);
  }
  .icon-btn svg{ width:100%; height:100%; }

  .auth-card{
    width: 100%;
    max-width: 460px;
  }

  .auth-card h1{
    font-size: 2.55rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--ink);
  }

  .auth-card p.subtitle{
    margin-top: 12px;
    color: var(--ink-soft);
    font-size: 1.14rem;
  }

  .status-msg{
    display:none;
    align-items:center;
    gap: 10px;
    margin-top: 24px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 0.96rem;
    font-weight: 500;
    line-height: 1.4;
  }
  .status-msg.is-visible{ display:flex; }
  .status-msg.success{
    background: var(--green-bg);
    color: var(--green-text);
    border: 1.5px solid var(--green-border);
  }
  .status-msg.error{
    background: var(--red-bg);
    color: var(--red-text);
    border: 1.5px solid var(--red-border);
  }
  .status-msg svg{ width: 18px; height: 18px; flex-shrink:0; }

  .btn-google{
    margin-top: 32px;
    width: 100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    padding: 19px 20px;
    border-radius: 12px;
    border: 1.5px solid var(--outline-border);
    background: var(--surface);
    color: var(--ink);
    font-size: 1.14rem;
    font-weight: 500;
    cursor:pointer;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .btn-google:hover:not(:disabled){
    border-color: var(--ink-soft);
    transform: translateY(-1px);
  }
  .btn-google:disabled{
    cursor: default;
    transform: none;
  }
  .btn-google svg.g-icon{ width: 22px; height: 22px; flex-shrink:0; }
  .g-label{ white-space: nowrap; }

  .g-spinner-wrap{
    display:none;
    width: 26px;
    height: 26px;
    border-radius: 999px;
    background: var(--green-mid);
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .btn-google.is-loading .g-icon{ display:none; }
  .btn-google.is-loading .g-spinner-wrap{ display:flex; }
  .btn-google.is-loading .g-label{ opacity: 0.75; }
  .btn-google.is-loading .last-used{ opacity: 0; }

  .g-spinner{
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2.2px solid rgba(255,255,255,0.35);
    border-top-color: #ffffff;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  .last-used{
    margin-left: auto;
    background: var(--green-light);
    color: var(--green-dark);
    font-size: 0.86rem;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    white-space: nowrap;
    transition: opacity .15s ease;
  }
  html[data-theme="dark"] .last-used{ color: #b7d17a; }

  .divider{
    display:flex;
    align-items:center;
    gap: 18px;
    margin: 34px 0 30px;
  }
  .divider::before, .divider::after{
    content:'';
    flex:1;
    height: 1px;
    background: var(--grey-line);
  }
  .divider span{
    font-size: 1.02rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .field{
    margin-bottom: 26px;
  }

  .field label{
    display:block;
    font-size: 1.08rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .field-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 12px;
  }
  .field-row label{ margin-bottom: 0; }

  .forgot-link{
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--green-mid);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }
  .forgot-link:hover{ color: var(--green-dark); }
  html[data-theme="dark"] .forgot-link:hover{ color: #b7d17a; }

  .input-wrap{
    position: relative;
  }

  .input-wrap input{
    width: 100%;
    padding: 18px 20px;
    border-radius: 12px;
    border: 1.5px solid var(--outline-border);
    background: var(--surface);
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    font-size: 1.08rem;
    outline: none;
    transition: border-color .15s ease;
  }
  .input-wrap input::placeholder{ color: #a3a59a; letter-spacing: normal; }
  .input-wrap input:focus{ border-color: var(--green-mid); }

  .input-wrap input[type="password"]{
    padding-right: 52px;
    letter-spacing: 2px;
  }
  .input-wrap input[type="password"]::placeholder{
    letter-spacing: normal;
  }

  .toggle-eye{
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 23px;
    height: 23px;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--ink-soft);
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }
  .toggle-eye svg{ width: 100%; height: 100%; }

  .btn-signin{
    width: 100%;
    margin-top: 10px;
    padding: 20px 20px;
    border-radius: 12px;
    border: none;
    background: var(--green-mid);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 1.16rem;
    font-weight: 700;
    cursor:pointer;
    transition: background .15s ease, transform .15s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 12px;
  }
  .btn-signin:hover:not(:disabled){
    background: var(--green-dark);
    transform: translateY(-2px);
  }
  .btn-signin:disabled{
    cursor: default;
    transform: none;
    opacity: 0.9;
  }

  .btn-spinner{
    display:none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2.4px solid rgba(255,255,255,0.35);
    border-top-color: #ffffff;
    animation: spin 0.7s linear infinite;
  }
  .btn-signin.is-loading .btn-spinner{ display:inline-block; }

  .signup-note{
    margin-top: 30px;
    text-align:center;
    font-size: 1.08rem;
    color: var(--ink-soft);
  }
  .signup-note a{
    color: var(--green-mid);
    font-weight: 700;
  }
  .signup-note a:hover{ color: var(--green-dark); }
  html[data-theme="dark"] .signup-note a:hover{ color: #b7d17a; }

  @media (max-width: 460px){
    .page{ padding: 32px 20px 48px; }
    .logo img{ height: 56px; }
    .auth-card h1{ font-size: 2.1rem; }
    .top-bar{ margin-bottom: 44px; }
    .btn-google{
      gap: 8px;
      padding: 17px 14px;
      font-size: 0.98rem;
    }
    .btn-google svg.g-icon{ width: 19px; height: 19px; }
    .last-used{
      font-size: 0.74rem;
      padding: 5px 10px;
    }
  }
</style>
</head>

    function friendlyError(code){
      const map = {
        'auth/invalid-email': 'That email address looks invalid.',
        'auth/user-disabled': 'This account has been disabled.',
        'auth/user-not-found': 'No account found with that email.',
        'auth/wrong-password': 'Incorrect password. Please try again.',
        'auth/invalid-credential': 'Incorrect email or password.',
        'auth/missing-password': 'Please enter your password.',
        'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
        'auth/popup-closed-by-user': 'Google sign-in was closed before completing.',
        'auth/network-request-failed': 'Network error. Check your connection and try again.'
      };
      return map[code] || 'Something went wrong. Please try again.';
    }

    const pwInput = document.getElementById('password');
    const toggleEye = document.getElementById('toggleEye');
    const eyeOpen = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');

    toggleEye.addEventListener('click', () => {
      const isPassword = pwInput.type === 'password';
      pwInput.type = isPassword ? 'text' : 'password';
      eyeOpen.style.display = isPassword ? 'none' : '';
      eyeClosed.style.display = isPassword ? '' : 'none';
      toggleEye.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });

    const loginForm = document.getElementById('loginForm');
    const signinBtn = document.getElementById('signinBtn');
    const signinLabel = signinBtn.querySelector('.btn-label');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearStatus();

      const email = document.getElementById('email').value.trim();
      const password = pwInput.value;

      signinBtn.disabled = true;
      signinBtn.classList.add('is-loading');
      signinLabel.textContent = 'Signing in…';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showStatus('success', 'Signed in successfully. Redirecting…');
      } catch (err) {
        showStatus('error', friendlyError(err.code));
      } finally {
        signinBtn.disabled = false;
        signinBtn.classList.remove('is-loading');
        signinLabel.textContent = 'Sign in';
      }
    });

    const googleBtn = document.getElementById('googleBtn');
    const provider = new GoogleAuthProvider();

    googleBtn.addEventListener('click', async () => {
      clearStatus();
      googleBtn.disabled = true;
      googleBtn.classList.add('is-loading');

      try {
        await signInWithPopup(auth, provider);
        showStatus('success', 'Signed in with Google. Redirecting…');
      } catch (err) {
        showStatus('error', friendlyError(err.code));
      } finally {
        googleBtn.disabled = false;
        googleBtn.classList.remove('is-loading');
      }
    });

    const forgotBtn = document.getElementById('forgotBtn');
    forgotBtn.addEventListener('click', async () => {
      clearStatus();
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showStatus('error', 'Enter your email above first, then tap "Forgot password?"');
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showStatus('success', 'Password reset email sent. Check your inbox.');
      } catch (err) {
        showStatus('error', friendlyError(err.code));
      }
    });

    const themeToggle = document.getElementById('themeToggle');
    const root = document.documentElement;

    function applyTheme(theme){
      if (theme === 'dark') {
        root.setAttribute('data-theme', 'dark');
      } else {
        root.removeAttribute('data-theme');
      }
    }
    applyTheme('light');

    themeToggle.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark';
      applyTheme(isDark ? 'light' : 'dark');
    });
  </script>

</body>
</html>
