<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temmysocial - Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #ffffff;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .page-wrapper {
            width: 100%;
            max-width: 440px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .nav-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .balance-pill {
            background-color: #e2e8f0;
            color: #3b6926; /* Darker, earthy green matching the design */
            font-size: 13px;
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 20px;
            letter-spacing: -0.2px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .notif-badge {
            position: absolute;
            top: -5px;
            right: -6px;
            background-color: #65a30d;
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 10px;
            border: 2px solid #ffffff;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background-color: #f59e0b;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Content Container */
        .content {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Welcome Section - Split Lines */
        .welcome-section {
            margin-bottom: 12px;
        }

        .welcome-title {
            font-size: 34px; /* Massive font size */
            font-weight: 900;
            color: #0f172a;
            line-height: 1.15;
            letter-spacing: -1.5px;
        }

        .welcome-line {
            display: block; /* Forces the split line exactly as designed */
        }

        .welcome-emoji {
            font-size: 28px;
            vertical-align: middle;
            margin-left: 4px;
        }

        .welcome-subtitle {
            font-size: 15px;
            color: #475569;
            font-weight: 600;
            margin-top: 10px;
            letter-spacing: -0.3px;
        }

        /* Stats Cards */
        .stat-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stat-label {
            font-size: 14.5px;
            color: #475569;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .stat-value {
            font-size: 38px;
            font-weight: 900;
            color: #0f172a;
            line-height: 1;
            letter-spacing: -1.5px;
        }

        .stat-value.green {
            color: #3b6926;
        }

        .stat-value.text-value {
            font-size: 30px; /* Slightly smaller for text to fit nicely */
            letter-spacing: -1.2px;
        }

        .stat-link {
            font-size: 14px;
            color: #334155; /* Slate grey, not green in this design */
            text-decoration: none;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            letter-spacing: -0.2px;
        }

        .stat-link:hover {
            color: #0f172a;
        }

        .arrow-icon {
            stroke-width: 3.5; /* Heavy stroke to match the chunky arrow in the image */
        }

        .stat-subtext {
            font-size: 14px;
            color: #475569;
            font-weight: 700;
            margin-top: 2px;
            letter-spacing: -0.2px;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="nav-icon-btn" aria-label="Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
            </div>
            <div class="header-right">
                <span class="balance-pill" id="headerBalance">...</span>
                <button class="icon-btn" aria-label="Dark Mode">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <button class="icon-btn" aria-label="Notifications">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="notif-badge" id="notifCount">0</span>
                </button>
                <div class="user-avatar" id="userAvatar">?</div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="content">
            <!-- Welcome Header (Two Lines) -->
            <div class="welcome-section">
                <h1 class="welcome-title">
                    <span class="welcome-line">Welcome back,</span>
                    <span class="welcome-line"><span id="userName">Loading...</span> <span class="welcome-emoji">👋</span></span>
                </h1>
                <p class="welcome-subtitle">Here's what's going on with your account</p>
            </div>

            <!-- Wallet Card -->
            <div class="stat-card">
                <span class="stat-label">Wallet balance</span>
                <span class="stat-value green" id="walletBalance">...</span>
                <div>
                    <a href="#" class="stat-link">
                        View wallet 
                        <svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </a>
                </div>
            </div>

            <!-- Purchases Card -->
            <div class="stat-card">
                <span class="stat-label">Total purchases</span>
                <span class="stat-value text-value" id="totalPurchases">...</span>
                <div>
                    <a href="#" class="stat-link">
                        View orders 
                        <svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </a>
                </div>
            </div>

            <!-- Inventory Card -->
            <div class="stat-card">
                <span class="stat-label">Available inventory</span>
                <span class="stat-value" id="availableInventory">...</span>
                <span class="stat-subtext" id="inventoryBreakdown">...</span>
            </div>
        </div>
    </div>

    <!-- Application Logic (No Hardcoded Data) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbCBQNB2zvaq-zoCNh81EdbE7_PsnKDBI",
            authDomain: "dammysocials-2b126.firebaseapp.com",
            projectId: "dammysocials-2b126",
            storageBucket: "dammysocials-2b126.firebasestorage.app",
            messagingSenderId: "1052998476146",
            appId: "1:1052998476146:web:46ecb610aa1a23f8a0bdeb"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const ui = {
            userName: document.getElementById('userName'),
            userAvatar: document.getElementById('userAvatar'),
            headerBalance: document.getElementById('headerBalance'),
            walletBalance: document.getElementById('walletBalance'),
            totalPurchases: document.getElementById('totalPurchases'),
            availableInventory: document.getElementById('availableInventory'),
            inventoryBreakdown: document.getElementById('inventoryBreakdown'),
            notifCount: document.getElementById('notifCount')
        };

        function renderDashboard(userData, appData) {
            // Populate Identity
            ui.userName.textContent = userData.fullName;
            ui.userAvatar.textContent = userData.initial;

            // Populate Top Bar
            ui.headerBalance.textContent = `₦${appData.balance.toLocaleString()}`;
            ui.notifCount.textContent = appData.notifications;

            // Populate Cards
            ui.walletBalance.textContent = `₦${appData.balance.toLocaleString()}`;
            
            if (appData.purchases === 0) {
                ui.totalPurchases.textContent = "No purchases yet";
                ui.totalPurchases.classList.add('text-value');
            } else {
                ui.totalPurchases.textContent = appData.purchases.toLocaleString();
                ui.totalPurchases.classList.remove('text-value');
            }

            ui.availableInventory.textContent = appData.inventory.total.toLocaleString();
            ui.inventoryBreakdown.textContent = `${appData.inventory.logs} logs · ${appData.inventory.tools} tools`;
        }

        onAuthStateChanged(auth, (user) => {
            // Simulated fetch replacing hardcoded markup elements
            const mockState = {
                user: {
                    fullName: user ? (user.displayName || "User") : "Daniel Idoghe",
                    initial: user ? (user.displayName || user.email).charAt(0).toUpperCase() : "D"
                },
                metrics: {
                    balance: 0,
                    notifications: 36,
                    purchases: 0,
                    inventory: {
                        total: 132,
                        logs: 106,
                        tools: 26
                    }
                }
            };
            renderDashboard(mockState.user, mockState.metrics);
        });
    </script>
</body>
</html>
