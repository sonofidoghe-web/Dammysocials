<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temmysocial - Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background-color: #fcfcfc;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .page-wrapper {
            width: 100%;
            max-width: 440px;
            background-color: #fcfcfc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .nav-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .balance-pill {
            background-color: #e5e7eb;
            color: #4c7a27;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 20px;
            letter-spacing: -0.3px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .notif-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: #65a30d;
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 10px;
            border: 1.5px solid #ffffff;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            background-color: #f59e0b;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Content Container */
        .content {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Welcome Section */
        .welcome-section {
            margin-bottom: 8px;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 900;
            color: #111111;
            line-height: 1.2;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .welcome-emoji {
            font-size: 24px;
        }

        .welcome-subtitle {
            font-size: 14.5px;
            color: #4b5563;
            font-weight: 500;
            margin-top: 6px;
        }

        /* Stats Cards */
        .stat-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .stat-label {
            font-size: 14px;
            color: #4b5563;
            font-weight: 600;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 900;
            color: #111111;
            line-height: 1;
            letter-spacing: -1px;
        }

        .stat-value.green {
            color: #4c7a27;
        }

        .stat-value.text-value {
            font-size: 26px;
            letter-spacing: -0.5px;
        }

        .stat-link {
            font-size: 13.5px;
            color: #4b5563;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .stat-link:hover {
            color: #111111;
        }

        .stat-subtext {
            font-size: 13.5px;
            color: #4b5563;
            font-weight: 600;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="nav-icon-btn" aria-label="Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
            </div>
            <div class="header-right">
                <span class="balance-pill" id="headerBalance">₦0</span>
                <button class="icon-btn" aria-label="Dark Mode">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <button class="icon-btn" aria-label="Notifications">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="notif-badge" id="notifCount">0</span>
                </button>
                <div class="user-avatar" id="userAvatar">?</div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="content">
            <!-- Welcome Header -->
            <div class="welcome-section">
                <h1 class="welcome-title">
                    Welcome back, <span id="userName">User</span> <span class="welcome-emoji">👋</span>
                </h1>
                <p class="welcome-subtitle">Here's what's going on with your account</p>
            </div>

            <!-- Cards -->
            <div class="stat-card">
                <span class="stat-label">Wallet balance</span>
                <span class="stat-value green" id="walletBalance">₦0</span>
                <a href="#" class="stat-link">View wallet &rarr;</a>
            </div>

            <div class="stat-card">
                <span class="stat-label">Total purchases</span>
                <span class="stat-value text-value" id="totalPurchases">Loading...</span>
                <a href="#" class="stat-link">View orders &rarr;</a>
            </div>

            <div class="stat-card">
                <span class="stat-label">Available inventory</span>
                <span class="stat-value" id="availableInventory">0</span>
                <span class="stat-subtext" id="inventoryBreakdown">0 logs · 0 tools</span>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyCbCBQNB2zvaq-zoCNh81EdbE7_PsnKDBI",
            authDomain: "dammysocials-2b126.firebaseapp.com",
            projectId: "dammysocials-2b126",
            storageBucket: "dammysocials-2b126.firebasestorage.app",
            messagingSenderId: "1052998476146",
            appId: "1:1052998476146:web:46ecb610aa1a23f8a0bdeb"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // DOM Elements
        const ui = {
            userName: document.getElementById('userName'),
            userAvatar: document.getElementById('userAvatar'),
            headerBalance: document.getElementById('headerBalance'),
            walletBalance: document.getElementById('walletBalance'),
            totalPurchases: document.getElementById('totalPurchases'),
            availableInventory: document.getElementById('availableInventory'),
            inventoryBreakdown: document.getElementById('inventoryBreakdown'),
            notifCount: document.getElementById('notifCount')
        };

        // Data Rendering Function
        function renderDashboard(userData, appData) {
            // User Data
            ui.userName.textContent = userData.firstName;
            ui.userAvatar.textContent = userData.initial;

            // Header Data
            ui.headerBalance.textContent = `₦${appData.balance.toLocaleString()}`;
            ui.notifCount.textContent = appData.notifications;

            // Cards Data
            ui.walletBalance.textContent = `₦${appData.balance.toLocaleString()}`;
            
            if (appData.purchases === 0) {
                ui.totalPurchases.textContent = "No purchases yet";
            } else {
                ui.totalPurchases.textContent = appData.purchases.toLocaleString();
                ui.totalPurchases.classList.remove('text-value');
            }

            ui.availableInventory.textContent = appData.inventory.total.toLocaleString();
            ui.inventoryBreakdown.textContent = `${appData.inventory.logs} logs · ${appData.inventory.tools} tools`;
        }

        // Firebase Auth Listener
        onAuthStateChanged(auth, (user) => {
            // Mock API Response / State structure (Replace with actual Firestore fetch)
            const mockState = {
                user: {
                    firstName: user ? (user.displayName || user.email.split('@')[0]) : "Daniel",
                    initial: user ? (user.displayName || user.email).charAt(0).toUpperCase() : "D"
                },
                metrics: {
                    balance: 0,
                    notifications: 36,
                    purchases: 0,
                    inventory: {
                        total: 132,
                        logs: 106,
                        tools: 26
                    }
                }
            };

            // Execute render
            renderDashboard(mockState.user, mockState.metrics);
        });
    </script>
</body>
</html>
